services:
  database:
    image: postgres:16
    container_name: netdoctor-db
    environment:
      POSTGRES_DB: netdoctor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - netdoctor_db:/var/lib/postgresql/data

volumes:
  netdoctor_db:
